<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none" role="img" aria-label="Schlafroutinen für Babys  ruhige Abendstimmung">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182331"/>
      <stop offset="1" stop-color="#1f2e3a"/>
    </linearGradient>
    <linearGradient id="moonGlow" x1="600" y1="80" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7eb8d4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7eb8d4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="600" cy="260" rx="340" ry="200" fill="url(#moonGlow)"/>

  <!-- Moon -->
  <circle cx="880" cy="130" r="56" fill="#7eb8d4" fill-opacity="0.15"/>
  <path d="M880 82a48 48 0 1 0 0 96a38 38 0 1 1 0-96z" fill="#7eb8d4" fill-opacity="0.45"/>

  <!-- Stars -->
  <circle cx="160" cy="100" r="2" fill="#7eb8d4" fill-opacity="0.7"/>
  <circle cx="210" cy="160" r="1.5" fill="#c4b5e8" fill-opacity="0.6"/>
  <circle cx="1020" cy="200" r="2" fill="#7eb8d4" fill-opacity="0.5"/>
  <circle cx="120" cy="280" r="1.5" fill="#7eb8d4" fill-opacity="0.4"/>

  <!-- Crib silhouette -->
  <g transform="translate(600 320)">
    <rect x="-120" y="20" width="240" height="90" rx="12" fill="#243038" stroke="#7eb8d4" stroke-width="2"/>
    <path d="M-120 20 L-100-30 L100-30 L120 20" stroke="#7eb8d4" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <line x1="-60" y1="20" x2="-60" y2="110" stroke="#2d3d47" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="110" stroke="#2d3d47" stroke-width="2"/>
    <line x1="60" y1="20" x2="60" y2="110" stroke="#2d3d47" stroke-width="2"/>
    <!-- Sleeping baby hint -->
    <ellipse cx="0" cy="55" rx="28" ry="18" fill="#2d3d47"/>
    <circle cx="-8" cy="48" r="14" fill="#243038" stroke="#c4b5e8" stroke-width="1.5"/>
  </g>

  <!-- Soft lamp light -->
  <path d="M320 420 L420 280 L520 420 Z" fill="#c4b5e8" fill-opacity="0.08"/>
  <rect x="395" y="420" width="50" height="8" rx="4" fill="#243038" stroke="#7eb8d4" stroke-width="1.5"/>
  <path d="M420 280 L420 420" stroke="#7eb8d4" stroke-width="2" stroke-linecap="round"/>

  <text x="600" y="520" text-anchor="middle" fill="#e8f0f3" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="700">Schlafroutinen</text>
  <text x="600" y="558" text-anchor="middle" fill="#8fa5ad" font-family="system-ui,Segoe UI,sans-serif" font-size="19">Ruhige Abende für Babys &amp; Eltern</text>
  <text x="600" y="592" text-anchor="middle" fill="#5c7079" font-family="system-ui,Segoe UI,sans-serif" font-size="14">Moonli Blog · News</text>
</svg>
