name: News überarbeiten

# Feedback an den Bot – überarbeitet den aktuellen Entwurf auf content-drafts
on:
  workflow_dispatch:
    inputs:
      feedback:
        description: "Dein Feedback an den Bot (z.B. kürzer, mehr Fokus Schlaf, Ton lockerer)"
        required: true
        type: string
      article_slug:
        description: "Optional: Dateiname ohne .md (leer = neuester Entwurf)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Draft-Branch auschecken
        run: bash .github/scripts/checkout-content-drafts.sh

      - name: Artikel überarbeiten
        run: npx tsx scripts/generate/revise-news.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEEDBACK: ${{ inputs.feedback }}
          ARTICLE_SLUG: ${{ inputs.article_slug }}

      - name: Änderungen speichern
        run: bash .github/scripts/push-content-draft.sh "blog(revise): news feedback"

      - name: Review-Benachrichtigung
        run: npx tsx scripts/generate/notify-review.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTICLE_SLUG: ${{ inputs.article_slug }}
