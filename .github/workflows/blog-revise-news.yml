name: News überarbeiten

# Feedback an den Bot – überarbeitet den aktuellen Entwurf auf content-drafts
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Bei Push überspringen
        if: github.event_name == 'push'
        run: echo "Manueller Workflow – bei Push übersprungen."

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: github.event_name == 'workflow_dispatch'

      - name: Draft-Branch auschecken
        if: github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/checkout-content-drafts.sh

      - name: Artikel überarbeiten
        if: github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/generate/revise-news.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Änderungen speichern
        if: github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/push-content-draft.sh "blog(revise): news feedback"

      - name: Review-Benachrichtigung
        if: github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/generate/notify-review.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
