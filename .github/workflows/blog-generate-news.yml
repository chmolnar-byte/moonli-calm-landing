name: Generate Blog News

# Mittwoch 08:00 CET – Entwurf + GitHub-Issue zur Prüfung
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Bei Push überspringen
        if: github.event_name == 'push'
        run: echo "Geplanter/manueller Workflow – bei Push übersprungen."

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

      - name: OpenAI API-Key prüfen
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: npx tsx scripts/generate/verify-openai.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Draft-Branch auschecken
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: bash .github/scripts/checkout-content-drafts.sh

      - name: GitHub-Labels anlegen
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "blog-review" --color "0E8A16" --description "News-Entwurf zur Prüfung" 2>/dev/null || true
          gh label create "blog-deploy" --color "FBCA04" --description "Deploy-Vorschau Sonntag" 2>/dev/null || true

      - name: News-Artikel generieren
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        id: generate
        run: npx tsx scripts/generate/generate-news.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Entwurf committen
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: bash .github/scripts/push-content-draft.sh "blog(draft): news $(date -u +%Y-%m-%d)"

      - name: Review-Benachrichtigung (GitHub Issue)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: npx tsx scripts/generate/notify-review.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTICLE_SLUG: ${{ steps.generate.outputs.article_slug }}
