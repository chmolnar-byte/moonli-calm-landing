name: Generate Blog News

# 1x pro Woche: Freitag 07:00 UTC (08:00 CET) – Entwurf vor Sonntag-Publish
on:
  schedule:
    - cron: "0 7 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Draft-Branch auschecken
        run: bash .github/scripts/checkout-content-drafts.sh

      - run: npx tsx scripts/generate/generate-news.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Entwurf committen
        run: bash .github/scripts/push-content-draft.sh "blog(draft): news v2 $(date -u +%Y-%m-%d)"
