name: News freigeben

# Setzt draft: false – Artikel wird am Sonntag deployed
on:
  workflow_dispatch:
    inputs:
      article_slug:
        description: "Optional: Dateiname ohne .md (leer = neuester Entwurf)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  approve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Draft-Branch auschecken
        run: bash .github/scripts/checkout-content-drafts.sh

      - name: Freigeben
        run: npx tsx scripts/generate/approve-news.ts
        env:
          ARTICLE_SLUG: ${{ github.event.inputs.article_slug }}

      - name: Freigabe committen
        run: bash .github/scripts/push-content-draft.sh "blog(approve): news freigegeben"
