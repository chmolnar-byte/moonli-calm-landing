name: News freigeben

# Setzt draft: false – Artikel wird am Sonntag deployed
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Bei Push überspringen
        if: github.event_name == 'push'
        run: echo "Manueller Workflow – bei Push übersprungen."

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: github.event_name == 'workflow_dispatch'

      - name: Draft-Branch auschecken
        if: github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/checkout-content-drafts.sh

      - name: Freigeben
        if: github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/generate/approve-news.ts

      - name: Freigabe committen
        if: github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/push-content-draft.sh "blog(approve): news freigegeben"
