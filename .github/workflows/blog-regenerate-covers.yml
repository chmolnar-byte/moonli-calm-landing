name: Blog Cover generieren

# Manuell starten – generiert KI-Cover für Live-Artikel (DALL-E 3)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: OpenAI API-Key prüfen
        run: npx tsx scripts/generate/verify-openai.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: KI-Cover für Live-Artikel generieren
        run: npx tsx scripts/generate/regenerate-live-covers.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/blog/generated/ src/content/news/ src/content/features/
          if git diff --staged --quiet; then
            echo "Keine neuen Cover – nichts zu committen."
          else
            git commit -m "blog: KI-Cover für Live-Artikel generiert."
            git push origin main
          fi
