name: Blog Cover generieren

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blog-regenerate-covers.yml"
      - "scripts/generate/regenerate-live-covers.ts"
      - "scripts/generate/lib/images.ts"
      - "scripts/generate/lib/editorial.ts"

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: KI-Cover für Live-Artikel generieren
        run: npx tsx scripts/generate/regenerate-live-covers.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/blog/generated/ src/content/news/ src/content/features/
          if git diff --staged --quiet; then
            echo "Keine neuen Cover – nichts zu committen."
          else
            git commit -m "blog: KI-Cover für Live-Artikel generiert."
            git push origin main
          fi
