[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  PUBLIC_GA_MEASUREMENT_ID = "G-497RKXKY2W"
  VITE_GA_MEASUREMENT_ID = "G-497RKXKY2W"

# Production nur von main – in Netlify UI unter Build & deploy → Branches:
# "Production branch: main", Branch deploys: off (oder nur content-drafts ausgeschlossen)

[context.production]
  branch = "main"

# Draft-Branch nicht bauen (falls Branch-Deploys aktiv sind)
[context.content-drafts]
  ignore = "exit 0"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600"

# www verschluckt sonst /app-ads.txt und landet auf der Startseite.
[[redirects]]
  from = "https://www.moonli.net/*"
  to = "https://moonli.net/:splat"
  status = 301
  force = true
